<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top Six Hockey | OHL, WHL &amp; QMJHL Line Combinations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef2;--ink:#14202b;--mute:#56656f;--ice:#e6f1f8;--board:#9fb0bd;--blue:rgba(43,95,168,.55);--red:rgba(200,16,46,.5);--pill:#ffffffcc;--head:#12315f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1319;--ink:#e9f0f5;--mute:#9aabb7;--ice:#1b2a35;--board:#3d5262;--blue:rgba(80,140,220,.5);--red:rgba(230,70,90,.45);--pill:#0d1319cc;--head:#0b1d3a}}
:root[data-theme="dark"]{--bg:#0d1319;--ink:#e9f0f5;--mute:#9aabb7;--ice:#1b2a35;--board:#3d5262;--blue:rgba(80,140,220,.5);--red:rgba(230,70,90,.45);--pill:#0d1319cc;--head:#0b1d3a}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--head);color:#fff;padding:16px 16px 12px}
.wrap,main{max-width:760px;margin:0 auto}
h1{margin:0;font-size:1.3rem}
header p{margin:2px 0 0;opacity:.8;font-size:.88rem}
.brand{display:flex;align-items:center;gap:14px}.logo{flex:none;width:84px;height:auto;display:block}.brand h1{font-size:1.45rem}.gamelink{margin-left:auto;flex:none;color:#fff;text-decoration:none;font-weight:600;font-size:.88rem;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.1)}.gamelink:hover{background:rgba(255,255,255,.22)}@media (max-width:560px){.brand{flex-wrap:wrap}.gamelink{margin-left:98px}}
main{padding:12px 12px 24px}
.sels{display:flex;gap:8px;max-width:100%}.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--board);background:var(--pill);color:var(--ink);max-width:100%}
.game{font-size:.88rem;color:var(--mute)}.game b{color:var(--ink)}
.bar{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px}.gwrap{text-align:left}.score{margin-top:4px;font-size:.92rem;font-weight:700;color:var(--ink)}.score:empty{display:none}.score .st{display:inline-block;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;background:var(--pill);color:var(--mute);border:1px solid var(--board);border-radius:99px;padding:2px 9px;margin-left:10px;vertical-align:1px}.score .st.live{background:#c8102e;border-color:#c8102e;color:#fff}.score .clk{font-weight:500;color:var(--mute);margin-left:8px}.score .w{font-weight:800}
@media(max-width:700px){.gwrap{text-align:left}}
.note{font-size:.78rem;color:var(--mute);margin:0 0 10px}
.rink{position:relative;border-radius:18px;overflow:hidden;border:3px solid #0b1219;background:linear-gradient(180deg,#8fa9b9 0,#d6e6ef 230px,#f2f8fb 430px,#e3eef4 100%);--ink:#0f1c28;--mute:#445663;--pill:#ffffffd9;color:var(--ink)}
.arena{position:absolute;left:0;top:0;width:100%;height:230px}
.ice{position:absolute;left:0;right:0;top:230px;bottom:0;overflow:hidden}
.ice svg{position:absolute;inset:0;width:100%;height:100%}
.cl{position:absolute;left:50%;top:0;bottom:0;width:70px;transform:translateX(-50%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(179,36,58,.3),rgba(179,36,58,.8))}
.in{position:relative;padding:246px 8px 16px}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--pill);color:var(--mute);border-radius:99px;padding:2px 10px;margin:6px 0 2px 4px}
.row{display:flex;justify-content:space-around;align-items:flex-start;gap:2px;margin-bottom:6px}
.p{flex:1;max-width:140px;min-width:0;text-align:center}.p.h{flex:.5;max-width:70px}
.p svg{width:100%;max-width:104px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.nm{font-size:.78rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere;margin-top:1px}
.fn{font-size:.68rem;color:var(--mute)}
.empty{text-align:center;padding:28px 16px 36px}
.empty .p{margin:0 auto 10px;max-width:130px}
.empty p{margin:4px auto;max-width:420px;background:var(--pill);border-radius:12px;padding:8px 12px;font-size:.9rem}
footer{font-size:.74rem;color:var(--mute);text-align:center;padding:0 12px 20px}
.sec{background:#232f5a;color:#fff;text-align:center;font-weight:600;font-size:1.05rem;padding:6px 8px;margin:12px 0 8px}
.cols{display:flex;justify-content:space-around;gap:2px;margin-bottom:4px}
.ch{flex:1;max-width:140px;min-width:0;background:#232f5a;color:#fff;text-align:center;font-size:.85rem;padding:4px 2px}
.row{border-bottom:1px solid rgba(15,28,40,.2);padding-bottom:6px;margin-bottom:8px}
.row:last-child{border-bottom:0}
.inj{color:#e11d2e;font-weight:900;margin-left:4px;-webkit-text-stroke:2px #000;paint-order:stroke fill;cursor:help;text-transform:none}
.ijb{background:#0f1830;border:1px solid #232f5a;border-radius:8px;padding:6px 14px 10px;color:#e6ebf5}
.ijt{margin:10px 0 2px;font-weight:700;font-size:.88rem;color:#fff}
.ijl{font-size:.82rem;color:#c9d1e0;margin:0 0 2px 8px}
.ijl .inj{-webkit-text-stroke:0;margin:0 4px 0 0}
.ns{text-align:center;color:#5a6577;font-size:.9rem;margin:6px 0 10px}
.nm{text-transform:uppercase;font-size:.74rem;letter-spacing:.01em;margin-top:8px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 0 2px #000,0 0 3px #000}
.p svg{max-width:120px}
.rink{background:#dfe8ee}
.arena,.ice{display:none}
#pop{position:fixed;z-index:60;display:none;width:260px;max-width:calc(100vw - 12px);background:#232f5a;color:#fff;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.45);padding:10px 12px 12px;font-size:.8rem;line-height:1.35;pointer-events:none;border:1px solid rgba(255,255,255,.35)}
#pop .ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.3)}
#pop .pn{font-weight:800;font-size:.92rem}#pop .pm{color:rgba(255,255,255,.75);font-weight:600}
#pop .pi{background:#fff;color:#0f1c28;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:1px 8px}
#pop .pr .tp{color:#ff9a1f;font-weight:700}#pop .pr{display:flex;gap:8px;margin:2px 0}#pop .fl{height:11px;width:auto;vertical-align:-1px;margin-left:5px;border-radius:1.5px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}#pop .pr i{font-style:normal;color:rgba(255,255,255,.7);min-width:78px;flex:none}
#pop .pt{margin:8px 0 4px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.7)}
#pop .pst{display:flex;gap:2px}#pop .pst div{flex:1;text-align:center;background:rgba(255,255,255,.16);border-radius:6px;padding:3px 0}
#pop .pst b{display:block;font-size:.62rem;color:rgba(255,255,255,.7)}#pop .pst span{font-weight:800}
.p.hv{cursor:pointer}
.bgimg{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(760px,100vw);height:100vh;height:100lvh;object-fit:cover;object-position:center top;display:block;z-index:0;pointer-events:none}
.rink{-webkit-clip-path:inset(0 round 18px);clip-path:inset(0 round 18px)}

.board{margin-top:18px;padding:16px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:var(--head);color:#fff;--ink:#fff;--mute:rgba(255,255,255,.72);--board:rgba(255,255,255,.28);--bg:rgba(255,255,255,.1)}
.board h2{margin:0 0 10px;font-size:1.05rem}
.bd-note{margin:0 0 10px;font-size:.85rem;color:var(--mute)}
.board textarea,.board input[type=text],.board input[type=email],.board input[type=password]{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--board);background:var(--bg);color:var(--ink)}
.board textarea{resize:vertical;min-height:64px}
.bd-fields{display:grid;gap:8px;margin-bottom:10px}
.bd-act{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.bd-send{font:inherit;font-weight:700;border:0;border-radius:8px;padding:7px 16px;background:#3d7be0;color:#fff;cursor:pointer}
.bd-b{font:inherit;font-size:.82rem;border:1px solid var(--board);border-radius:99px;padding:3px 11px;background:transparent;color:var(--mute);cursor:pointer}
.bd-b.on{color:#c8102e;border-color:#c8102e}
.bd-b:disabled{opacity:.55;cursor:default}
.bd-l{font:inherit;font-size:.78rem;border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0 10px 0 0}
.bd-me{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.bd-avwrap{cursor:pointer;display:inline-flex}
.bd-av{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.95rem}
.bd-big{width:48px;height:48px;font-size:1.2rem}
.bd-thread{border-top:1px solid var(--board);padding:12px 0 4px}
.bd-post{display:flex;gap:10px;padding:0 0 10px}
.bd-rep{margin-left:46px;padding-left:12px;border-left:2px solid var(--board)}
.bd-main{min-width:0;flex:1}
.bd-hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bd-time{font-size:.74rem;color:var(--mute)}
.bd-to{font-size:.74rem;color:var(--mute);margin-top:1px}
.bd-body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.bd-rbox{margin-top:8px}
.bd-msg{font-size:.85rem;margin:8px 0;color:#c8102e}.bd-msg.good{color:#1f8a4c}
.bd-fine{font-size:.72rem;color:var(--mute);margin:10px 0 0}

#profBtn{margin-left:8px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;color:#fff}
.pf-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.pf{background:var(--bg);color:var(--ink);border:1px solid var(--board);border-radius:14px;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.pf h2{margin:0 0 12px;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.pf-x{border:0;background:none;color:var(--mute);font-size:1.5rem;cursor:pointer;line-height:1}
.pf .pf-l{display:block;font-size:.78rem;color:var(--mute);margin:14px 0 4px}
.pf input[type=text],.pf input[type=email],.pf input[type=password]{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--board);background:var(--pill);color:var(--ink)}
.pf-row{display:flex;gap:8px;align-items:center}
.pf-top{display:flex;gap:14px;align-items:center}
.pf-sec{margin-top:18px;padding-top:12px;border-top:1px solid var(--board)}
.pf-fields{display:grid;gap:8px;margin-bottom:10px}
.bd-def{filter:grayscale(1);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
</style>
</head>
