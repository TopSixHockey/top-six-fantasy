          EOF
          cat > /tmp/seed.py <<'EOF'
          import json, os, secrets, urllib.request, urllib.error
          from datetime import datetime, timezone
          U = os.environ["U"].rstrip("/"); K = os.environ["K"]
          def call(method, path, body=None, prefer=None):
              h = {"apikey": K, "Authorization": "Bearer " + K, "Content-Type": "application/json"}
              if prefer: h["Prefer"] = prefer
              req = urllib.request.Request(U + path, data=json.dumps(body).encode() if body is not None else None, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode() or "null")
              except urllib.error.HTTPError as e:
                  print("ERR", method, path, e.code, e.read().decode()[:400]); raise
          plan = json.load(open("/tmp/plan.json"))
          users, entries = [], []
          for t in plan:
              email = "topsixhockey6+staff%d@gmail.com" % t["n"]
              u = call("POST", "/auth/v1/admin/users", {"email": email, "password": secrets.token_urlsafe(32), "email_confirm": True, "user_metadata": {"display_name": "Top Six Hockey"}})
              uid = u["id"]; users.append(uid)
              prof = call("GET", "/rest/v1/profiles?id=eq.%s&select=*" % uid)
              if not prof: call("POST", "/rest/v1/profiles", {"id": uid, "display_name": "Top Six Hockey"}, "return=minimal")
              elif prof[0].get("display_name") != "Top Six Hockey": call("PATCH", "/rest/v1/profiles?id=eq.%s" % uid, {"display_name": "Top Six Hockey"}, "return=minimal")
              e = call("POST", "/rest/v1/entries", {"user_id": uid, "contest": "public-2026-" + t["lg"], "league": t["lg"], "team_name": t["name"]}, "return=representation")[0]
              entries.append(e["id"])
              call("POST", "/rest/v1/entry_players", [{"entry_id": e["id"], "player_id": p, "baseline_pts": b} for p, b in t["p"]], "return=minimal")
              call("PATCH", "/rest/v1/entries?id=eq.%s" % e["id"], {"locked_at": datetime.now(timezone.utc).isoformat()}, "return=minimal")
              print("ok", t["lg"], t["name"])
          st = json.load(open("lineups/notify_state.json"))
          st["users"] = st.get("users", []) + users
          st["entries"] = st.get("entries", []) + entries
          json.dump(st, open("lineups/notify_state.json", "w"))
          print("recorded", len(users), "users and", len(entries), "entries as already seen")
          EOF
          python3 /tmp/seed.py
      - name: Save notification state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lineups/notify_state.json
          git commit -m "Record staff teams as already seen" || exit 0
          git pull --rebase -q
          git push
