name: league-counts
on:
  push:
    paths: ['.github/workflows/league-counts.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Counts only
        env:
          U: ${{ secrets.SUPABASE_URL }}
          K: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat > /tmp/c.py <<'EOF'
          import json, os, urllib.request, datetime
          U = os.environ["U"].rstrip("/"); K = os.environ["K"]
          def get(p):
              r = urllib.request.Request(U + p, headers={"apikey": K, "Authorization": "Bearer " + K, "Accept": "application/json"})
              return json.loads(urllib.request.urlopen(r, timeout=60).read())
          defs = get("/rest/v1/").get("definitions", {})
          print("tables:", sorted(k for k in defs if k.startswith("p")))
          cols = sorted(defs.get("pteams", {}).get("properties", {}))
          print("pteams columns:", cols)
          lk = [c for c in cols if "league" in c]
          L = get("/rest/v1/pleagues?select=*")
          T = get("/rest/v1/pteams?select=*") if lk else []
          OWNER = "f61342e1-1bda-4179-b2ef-c0b7b631affd"
          now = datetime.datetime.now(datetime.timezone.utc)
          for l in L:
              n = [t for t in T if lk and t.get(lk[0]) == l["id"]]
              age = now - datetime.datetime.fromisoformat(str(l["created_at"]).replace("Z", "+00:00"))
              print("MINE" if l.get("commissioner") == OWNER else "OTHER", "| status:", l.get("status"), "| max_teams:", l.get("max_teams"), "| teams:", len(n), "| age_hours:", round(age.total_seconds() / 3600, 1), "| chl:", l.get("chl_league"))
          EOF
          echo BEGIN
          python3 /tmp/c.py
          echo END
