name: pdf-probe
on:
  push:
    paths: ['.github/workflows/pdf-probe.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Read the card
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          curl -s -A "Mozilla/5.0" -o /tmp/mh.pdf "https://cluster.leaguestat.com/game-lineups/whl/1023336/MH_2026-11-24.pdf"
          pdftotext -layout /tmp/mh.pdf /tmp/mh.txt
          echo "BEGIN"
          sed 's/   */ | /g' /tmp/mh.txt | grep -v '^ *$' | head -60
          echo "END"
