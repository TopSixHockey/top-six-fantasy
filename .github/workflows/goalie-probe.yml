name: Goalie probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Read game sheets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          curl -sL "https://cluster.leaguestat.com/game-lineups/lhjmq/32920/NFL@MON_2026-11-22.pdf" -o f.pdf
          pdftotext -layout f.pdf - | grep -nE "^ *(GK|GB) |\(B / I\)|\(RA / HS\)|Moncton|MONCTON" | tr -s ' ' | cut -c1-120 | sed 's/^/L /'
