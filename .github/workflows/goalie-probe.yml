name: Goalie probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Read game sheets
        run: |
          for u in lhjmq/32663/ROU@BAC_2026-11-20 lhjmq/33109/HAL@SHA_2026-11-21 lhjmq/32920/NFL@MON_2026-11-22 lhjmq/33015/QUE@RIM_2026-11-22; do
            echo "=== $u"
            curl -sL "https://cluster.leaguestat.com/game-lineups/$u.pdf" -o f.pdf
            pdftotext -layout f.pdf - | grep -nE "^ *(GK|GB) |Partant|Substitut|^ *(VIS|LOC)|#[0-9]+ [A-Z]" | cut -c1-230
          done
