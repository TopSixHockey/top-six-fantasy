name: Update lineups

on:
  schedule:
    # Every 10 minutes from 7 AM to midnight Eastern (UTC hours cover both EST and EDT).
    # The script only does something when a game's puck drop is near; otherwise it just
    # refreshes tomorrow's start times in lineups/schedule.json.
    - cron: "*/10 11-23,0-4 * * *"
    # Two extra runs for the 3 AM Eastern player-stats refresh (EDT and EST); the lineup updater does nothing then.
    - cron: "5 7,8 * * *"
  workflow_dispatch:
    inputs:
      players:
        description: "Player pop-ups: auto = fill any gaps and refresh stats when due; full = refresh everything now; dry = full refresh but write nothing"
        default: "auto"
        type: choice
        options: [auto, full, dry]
      x_test_team:
        description: "Post ONE real test lineup card to X for this team key (for example barrie, whl_brandon, qmjhl_baiecomeau). Leave empty for a normal run."
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: update-lineups
  cancel-in-progress: false

jobs:
  lineups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lineup updater
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python lineups/update_lineups.py
      - name: Update player pop-ups
        continue-on-error: true   # a pop-up problem must never stop the lineup updates from being saved
        env:
          PLAYERS_MODE: ${{ github.event.inputs.players || 'auto' }}
        run: |
          case "$PLAYERS_MODE" in
            full) python lineups/update_players.py --full ;;
            dry)  python lineups/update_players.py --full --dry ;;
            *)    python lineups/update_players.py ;;
          esac
      - name: Sync injured players
        continue-on-error: true   # never stop the lineup updates from being saved
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python stats/sync_injuries.py
      - name: Commit changes
        run: |
          git config user.name "Top Six Hockey bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html lineups/schedule.json lineups/state.json lineups/x_queue.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto-update lineups"
          git pull --rebase origin main
          git push
      - name: Post lineups to X
        continue-on-error: true   # an X problem must never stop the lineup updates from being saved
        env:
          X_POSTING: ${{ vars.X_POSTING }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_TEST_TEAM: ${{ github.event.inputs.x_test_team }}
        run: |
          if [ -z "$X_TEST_TEAM" ] && ! grep -q '"id"' lineups/x_queue.json 2>/dev/null; then echo "Nothing to post to X"; exit 0; fi
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
          python -c "import PIL" 2>/dev/null || pip install --quiet pillow
          if [ -n "$X_TEST_TEAM" ]; then python lineups/post_to_x.py --test "$X_TEST_TEAM"; exit $?; fi
          python lineups/post_to_x.py
          git config user.name "Top Six Hockey bot"
          git config user.email "actions@users.noreply.github.com"
          git add lineups/x_queue.json lineups/x_posted.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "X posts"
          git pull --rebase origin main
          git push
