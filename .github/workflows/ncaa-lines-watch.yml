name: NCAA lines watcher (dry run)

# Manual only for now. Reads the team X lineup posts, has Claude read the graphics and
# reports what would change. It never edits index.html or posts anything.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back to look for lineup posts"
        default: "48"
      teams:
        description: "Team keys, comma separated (blank = all 17), e.g. ncaa_michigan,ncaa_denver"
        default: ""
      explore:
        description: "Only list each team's recent media posts (no lineup reading)"
        type: boolean
        default: false
      extra:
        description: "Extra X search words, e.g. (lines OR lineup)"
        default: ""
      limit:
        description: "Most posts to fetch per team"
        default: "20"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read lineup posts (dry run)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOURS: ${{ inputs.hours }}
          TEAMS: ${{ inputs.teams }}
          EXPLORE: ${{ inputs.explore }}
          EXTRA: ${{ inputs.extra }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=""
          if [ "$EXPLORE" = "true" ]; then ARGS="--explore"; fi
          python lineups/ncaa_lines_watch.py --hours "$HOURS" --teams "$TEAMS" --limit "$LIMIT" --extra "$EXTRA" $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lines-watch-report
          path: lineups/_watch_report.json
          if-no-files-found: ignore
