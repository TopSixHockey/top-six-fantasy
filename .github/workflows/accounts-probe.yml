name: Accounts probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: List account creation times
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          u = os.environ["SUPABASE_URL"].rstrip("/"); k = os.environ["SUPABASE_SERVICE_KEY"]
          r = urllib.request.Request(u + "/auth/v1/admin/users?per_page=200", headers={"apikey": k, "Authorization": "Bearer " + k})
          d = json.load(urllib.request.urlopen(r))
          us = sorted(d["users"], key=lambda x: x["created_at"])
          for i, x in enumerate(us, 1):
              print("ROW", i, x["created_at"][:19], (x.get("app_metadata") or {}).get("provider"), "confirmed" if (x.get("email_confirmed_at") or x.get("confirmed_at")) else "unconfirmed")
          PY
